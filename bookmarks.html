<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VT Bookmark Vault</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="bookmarks.css">
</head>
<body>
    <!-- Header -->
    <header class="bv-header">
        <div class="bv-logo">
            <span class="bv-logo-icon">📚</span>
            <div>
                <h1 class="bv-title" data-i18n="bvTitle">Bookmark Vault</h1>
                <p class="bv-subtitle" data-i18n="bvSubtitle">V-Train Pro · 本機收藏管理</p>
            </div>
        </div>
        <div class="bv-header-actions">
            <div class="bv-search-wrap">
                <span class="bv-search-icon">🔍</span>
                <input type="text" id="bvSearch" class="bv-search" data-i18n="bvSearch" placeholder="搜尋書籤標題或網址...">
            </div>
            <div class="bv-view-toggle">
                <button id="btnViewGrid" class="bv-view-btn active" data-i18n-title="bvGrid" title="格狀檢視">⊞</button>
                <button id="btnViewList" class="bv-view-btn" data-i18n-title="bvList" title="列表檢視">≡</button>
            </div>
        </div>
    </header>

    <div class="bv-body">
        <!-- Left Sidebar: Folder Tree -->
        <aside class="bv-sidebar">
            <div class="bv-sidebar-hdr">
                <span data-i18n="bvFolders">📁 資料夾</span>
                <button id="btnNewRootFolder" class="bv-add-root-btn" data-i18n-title="bvNewFolderTitle" title="新增資料夾">＋</button>
            </div>
            <nav id="bvFolderTree" class="bv-folder-tree">
                <!-- 動態渲染 -->
            </nav>
            <div class="bv-sidebar-footer">
                <div class="bv-stat-row">
                    <span class="bv-stat-label" data-i18n="bvTotal">📊 總收藏</span>
                    <span class="bv-stat-val" id="bvTotalCount">0</span>
                </div>
                <div class="bv-stat-row">
                    <span class="bv-stat-label" data-i18n="bvLike">👍 喜歡</span>
                    <span class="bv-stat-val" id="bvLikeCount">0</span>
                </div>
                <div class="bv-stat-row">
                    <span class="bv-stat-label" data-i18n="bvDislike">😤 不喜歡</span>
                    <span class="bv-stat-val" id="bvDislikeCount">0</span>
                </div>
            </div>
        </aside>

        <!-- Resizer Handle -->
        <div class="bv-sidebar-resizer" id="bvResizer"></div>

        <!-- Right Content: Bookmark Grid/List -->
        <main class="bv-content">
            <div class="bv-content-bar">
                <div class="bv-breadcrumb" id="bvBreadcrumb">
                    <!-- 動態渲染麵包屑 -->
                </div>
                <div class="bv-sort-row">
                    <label class="bv-sort-label" data-i18n="bvSort">排序：</label>
                    <select id="bvSort" class="bv-sort-select">
                        <option value="newest" data-i18n="bvSortNewest">最新加入</option>
                        <option value="oldest" data-i18n="bvSortOldest">最早加入</option>
                        <option value="title" data-i18n="bvSortTitle">標題 A-Z</option>
                        <option value="domain" data-i18n="bvSortDomain">網站</option>
                    </select>
                </div>
            </div>

            <div class="bv-subfolder-container hidden" id="bvSubfolderContainer">
                <button class="bv-scroll-btn bv-scroll-left" id="bvSubfolderLeft">&lt;</button>
                <div id="bvSubfolderGrid" class="bv-subfolder-grid">
                    <!-- 動態渲染子資料夾卡片 -->
                </div>
                <button class="bv-scroll-btn bv-scroll-right" id="bvSubfolderRight">&gt;</button>
            </div>

            <div id="bvGrid" class="bv-grid">
                <!-- 動態渲染影片卡片 -->
            </div>

            <div id="bvEmpty" class="bv-empty hidden">
                <div class="bv-empty-icon">📭</div>
                <p class="bv-empty-title" data-i18n="bvEmptyTitle">這裡還沒有收藏</p>
                <p class="bv-empty-sub" data-i18n="bvEmptySub">在影片播放時點擊 ❤️ 按鈕開始收藏</p>
            </div>

            <div id="bvPagination" class="bv-pagination-container"></div>
        </main>
    </div>

    <!-- 重新命名 / 新增 Modal -->
    <div id="bvModal" class="bv-modal-overlay hidden">
        <div class="bv-modal">
            <h3 id="bvModalTitle" data-i18n="bvNewFolder">新增資料夾</h3>
            <input type="text" id="bvModalInput" class="bv-modal-input" data-i18n="bvFolderName" placeholder="資料夾名稱">
            <div class="bv-modal-btns">
                <button id="bvModalCancel" class="bv-btn bv-btn-ghost" data-i18n="cancel">取消</button>
                <button id="bvModalConfirm" class="bv-btn bv-btn-accent" data-i18n="confirm">確認</button>
            </div>
        </div>
    </div>

    <!-- 確認刪除 Modal -->
    <div id="bvConfirmModal" class="bv-modal-overlay hidden">
        <div class="bv-modal">
            <h3 id="bvConfirmTitle" data-i18n="bvConfirmDelete">確認刪除</h3>
            <p id="bvConfirmDesc" class="bv-confirm-desc"></p>
            <div class="bv-modal-btns">
                <button id="bvConfirmCancel" class="bv-btn bv-btn-ghost" data-i18n="cancel">取消</button>
                <button id="bvConfirmOk" class="bv-btn bv-btn-danger" data-i18n="delete">刪除</button>
            </div>
        </div>
    </div>

    <!-- Toast -->
    <div id="bvToast" class="bv-toast hidden"></div>

    <!-- Right-click Context Menu -->
    <div id="bvContextMenu" class="bv-context-menu hidden">
        <div class="bv-cm-item" id="cmAddSubFolder"><span class="bv-cm-icon">➕</span> <span data-i18n="bvAddSubFolder">新增子資料夾</span></div>
        <div class="bv-cm-item" id="cmRename"><span class="bv-cm-icon">✏️</span> <span data-i18n="bvRename">重新命名</span></div>
        <div class="bv-cm-item" id="cmMoveFolder"><span class="bv-cm-icon">🚚</span> <span data-i18n="bvMoveFolder">移動資料夾</span></div>
        <div class="bv-cm-item danger" id="cmDelete"><span class="bv-cm-icon">🗑</span> <span data-i18n="delete">刪除</span></div>
    </div>

    <script src="shared_i18n.js"></script>
    <script src="db.js"></script>
    <script src="bookmarks.js"></script>
</body>
</html>
