<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title data-i18n="extName">V-Train Backup Center</title>
    <style>
        body {
            background-color: #121212;
            color: #eee;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        .backup-container {
            background: #1e1e1e;
            border-radius: 12px;
            padding: 30px;
            width: 500px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            text-align: center;
            border: 1px solid #333;
        }
        .header {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 10px;
            color: #fff;
        }
        .desc {
            font-size: 14px;
            color: #aaa;
            margin-bottom: 30px;
        }
        .progress-box {
            background: #2a2a2a;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .status-text {
            font-size: 16px;
            margin-bottom: 10px;
            font-weight: 500;
        }
        .progress-bar-bg {
            background: #111;
            height: 12px;
            border-radius: 6px;
            overflow: hidden;
            margin-top: 15px;
        }
        .progress-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, #00e676, #00b359);
            width: 0%;
            transition: width 0.3s ease;
        }
        .btn-close {
            background: #333;
            color: #fff;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            margin-top: 10px;
            transition: background 0.2s;
            display: none;
        }
        .btn-close:hover {
            background: #444;
        }
        .log-box {
            margin-top: 15px;
            font-size: 12px;
            color: #888;
            height: 120px;
            overflow-y: auto;
            text-align: left;
            background: #111;
            padding: 10px;
            border-radius: 4px;
            border: 1px solid #222;
        }
        .log-box div { margin-bottom: 4px; border-bottom: 1px solid #222; padding-bottom: 2px;}
        .spinner {
            display: inline-block;
            width: 24px;
            height: 24px;
            border: 3px solid rgba(255,255,255,0.2);
            border-radius: 50%;
            border-top-color: #00e676;
            animation: spin 1s ease-in-out infinite;
            margin-bottom: 15px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .hidden { display: none !important; }
        
        /* Custom scrollbar for logs */
        .log-box::-webkit-scrollbar { width: 6px; }
        .log-box::-webkit-scrollbar-track { background: #111; }
        .log-box::-webkit-scrollbar-thumb { background: #444; border-radius: 3px; }
    </style>
</head>
<body>

    <div class="backup-container">
        <div class="header">📦 Backup & Restore Center</div>
        <div class="desc" id="uiDesc">Please wait while the operation completes. Do not close this tab.</div>

        <div class="progress-box">
            <div class="spinner" id="spinner"></div>
            <div class="status-text" id="statusText">Initializing...</div>
            <button id="btnSelectFile" class="hidden" style="background: #00e676; color: #111; padding: 10px 20px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; margin-top: 5px; font-size: 15px;">📂 Select Backup File</button>
            <div class="progress-bar-bg" id="progressBg">
                <div class="progress-bar-fill" id="progressBar"></div>
            </div>
        </div>

        <div class="log-box" id="logBox"></div>

        <button class="btn-close" id="btnClose">Close Tab</button>
    </div>

    <!-- Hidden input for file selection (Import) -->
    <input type="file" id="fileInput" accept=".zip,.json" style="display: none;">

    <script src="shared_i18n.js"></script>
    <script src="db.js"></script>
    <script src="assets/jszip.min.js"></script>
    <script src="backup.js"></script>
</body>
</html>
